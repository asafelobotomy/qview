[package]
name = "qview"
description = "qview's window: the picture, zoom, the folder strip and Mark up (Qt Quick, themed by uQ)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "qview"
path = "src/main.rs"

[dependencies]
qview-core = { path = "../qview-core" }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"
