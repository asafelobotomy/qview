<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b48ead"/>
      <stop offset="1" stop-color="#5e81ac"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2a3d"/>
      <stop offset="1" stop-color="#433c58"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="58" cy="58" r="30"/></clipPath>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
